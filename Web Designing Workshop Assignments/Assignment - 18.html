<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
</head>

<body bgcolor="#f2f2f2" topmargin="0" leftmargin="0">

<br>
    
<table width="660" align="center" bgcolor="#ffffff" cellpadding="0" cellspacing="0" border="0">

    <tr>
        <td bgcolor="#1c267f" align="center" height="90">
            <font face="Times New Roman, serif" color="#ffffff" size="6">
                <b>ABC College Admission 2026</b>
            </font>
        </td>
    </tr>

    <tr>
        <td>
            <table width="100%" cellpadding="15" cellspacing="0" border="0">
                <tr>
                    <td>
                        <font face="Times New Roman, serif">

                            <h2>Courses and Fees</h2>

                            <table width="100%" border="1" bordercolor="#aaaaaa" cellpadding="5" cellspacing="0">
                                <caption>Available Courses</caption>

                                <thead>
                                    <tr bgcolor="#e8eaf6">
                                        <th align="center">Course</th>
                                        <th align="center">Seats</th>
                                        <th align="center">Fees</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr>
                                        <td align="left">B.Tech CSE</td>
                                        <td align="left">120</td>
                                        <td align="left">₹90,000</td>
                                    </tr>
                                    <tr>
                                        <td align="left">BCA</td>
                                        <td align="left">60</td>
                                        <td align="left">₹45,000</td>
                                    </tr>
                                </tbody>
                            </table>

                            <br>
                            
                            <form action="#" method="post">

                                <fieldset>
                                    <legend>Application Form</legend>

                                    <label for="name">Name:</label><br>
                                    <input type="text" id="name" name="name" size="30" required>
                                    <br><br>

                                    <label for="email">Email:</label><br>
                                    <input type="email" id="email" name="email" size="30" required>
                                    <br><br>

                                    <label for="course">Course:</label><br>
                                    <select id="course" name="course" required>
                                        <option value="B.Tech CSE">B.Tech CSE</option>
                                        <option value="BCA">BCA</option>
                                    </select>
                                    <br><br>

                                    <label for="statement">Statement:</label><br>
                                    <textarea id="statement" name="statement" rows="3" cols="45" required></textarea>
                                    <br><br>

                                    <button type="submit">Apply</button>

                                </fieldset>

                            </form>

                        </font>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td bgcolor="#1c267f" align="center" height="35">
            <font face="Times New Roman, serif" color="#ffffff" size="3">
                © 2026 ABC College
            </font>
        </td>
    </tr>

</table>

</body>
</html>
